<header class="barra">
  <div class="marca">
    <app-escudo tamano="pequeno" />
    <span class="sistema">Trabajo social</span>
  </div>
  <button type="button" (click)="salir()">Cerrar sesión</button>
</header>

<main class="contenido" [class.contenido-docente]="esDocente()">
  @if (usuario(); as u) {
    @if (esDocente()) {
      <app-docente-carga [docente]="u" />
    } @else {
      <!-- Vista Estudiante (conservada intacta) -->
      <div class="aviso-rol" role="status">
        <span class="icono" aria-hidden="true">
          <!-- birrete -->
          <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5 M22 9v6" /></svg>
        </span>
        <p>Ingresaste como <strong>{{ nombreRol() }}</strong></p>
      </div>

      <h1>¡Hola, {{ u.nombre }}!</h1>

      <dl class="datos">
        <dt>Correo</dt>
        <dd>{{ u.correo }}</dd>
        <dt>Carrera</dt>
        <dd>{{ u.carrera || '—' }}</dd>
      </dl>
    }
  }
</main>

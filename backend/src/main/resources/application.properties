spring.application.name=procesosoftware
server.port=8080

# --- Base de datos H2 en memoria ---
# Se borra cada vez que se apaga el backend. Si quieren que se guarde entre
# reinicios, cambien la URL por:  jdbc:h2:file:./data/procesodb
spring.datasource.url=jdbc:h2:mem:procesodb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Crea/actualiza las tablas solito a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web de H2 para ver las tablas: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:procesodb   usuario: sa   sin contraseña)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


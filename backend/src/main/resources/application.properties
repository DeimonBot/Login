spring.application.name=Prueba-Usuarios
server.port=8080

# H2 en memoria, base de datos "trabajoSocial"
spring.datasource.url=jdbc:h2:mem:trabajoSocial;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea la tabla al arrancar y la borra al apagar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console